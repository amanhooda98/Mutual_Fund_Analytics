name: Temporary opentrack Windows x64 source build

on:
  push:
    branches:
      - temp/opentrack-windows-build-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build opentrack from current master (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout opentrack source
        uses: actions/checkout@v7
        with:
          repository: opentrack/opentrack
          ref: master
          submodules: true

      - name: Checkout opentrack dependencies
        uses: actions/checkout@v7
        with:
          repository: opentrack/opentrack-depends
          submodules: true
          path: opentrack-depends

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install OpenCV
        uses: cvpkg/opencv-action@main
        with:
          opencv_tag: '4.x'
          BUILD_LIST: 'core,imgcodecs,imgproc,video,videoio,calib3d,highgui'
          BUILD_SHARED_LIBS: 'OFF'
          BUILD_WITH_STATIC_CRT: 'OFF'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          dir: "${{ github.workspace }}/qt"
          version: '6.10.3'
          modules: qtserialport qtmultimedia qtimageformats
          target: desktop

      - name: Configure CMake
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\workflows\build-windows.bat" cmake -GNinja -S "%GITHUB_WORKSPACE%" -B "%GITHUB_WORKSPACE%\build" -DCMAKE_BUILD_TYPE=Release "-DQt6_DIR=%QT_ROOT_DIR%\lib\cmake\Qt6" -DONNXRuntime_DIR=/usr/lib/cmake/onnxruntime

      - name: Build and install
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\workflows\build-windows.bat" cmake --build "%GITHUB_WORKSPACE%\build" --config Release --target install

      - name: Verify installation and write build metadata
        shell: pwsh
        run: |
          $installDir = Join-Path $env:GITHUB_WORKSPACE 'build\install'
          if (-not (Test-Path $installDir)) {
            throw "Expected install directory not found: $installDir"
          }

          $exe = Get-ChildItem -Path $installDir -Filter 'opentrack.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) {
            throw "opentrack.exe was not found in the install output; refusing to upload an incomplete artifact."
          }

          $commit = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          $buildInfo = @"
          Project: opentrack/opentrack
          Source branch: master
          Source commit: $commit
          Configuration: Release
          Target: Windows x64
          Executable: $($exe.FullName.Substring($installDir.Length).TrimStart('\'))
          "@
          $buildInfo | Set-Content -Encoding utf8 (Join-Path $installDir 'BUILD-INFO.txt')

          Write-Host "Verified executable: $($exe.FullName)"
          Get-ChildItem -Path $installDir -Recurse -File | Measure-Object -Property Length -Sum | Format-List

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentrack-windows-x64
          path: build/install/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
